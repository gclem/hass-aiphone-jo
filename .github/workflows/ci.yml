name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master

  hacs:
    name: HACS validation
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration
          ignore: brands
          comment: false

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements_lint.txt
      - run: ruff check .
      - run: ruff format --check .

  requirements:
    name: Requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements_lint.txt
      - name: Resolve manifest requirements with Home Assistant constraints
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_requirements.py latest dev

  go2rtc:
    name: go2rtc bridge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install test requirements, a WebRTC peer and ffmpeg
        run: |
          pip install -r requirements_test.txt aiortc imageio-ffmpeg
          jq -r '.requirements[]' custom_components/aiphone_jo/manifest.json \
            | xargs -r pip install
          ffmpeg_bin="$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          sudo ln -sf "$ffmpeg_bin" /usr/local/bin/ffmpeg
          ffmpeg -hide_banner -version | head -1
      - name: Start go2rtc
        env:
          GO2RTC_VERSION: v1.9.15
          GO2RTC_SHA256: 20b46c6910734cb05ecefb234066f36868ff19b42ba1418a7a32e13a3e035712
        run: |
          curl -fsSL -o "$RUNNER_TEMP/go2rtc" \
            "https://github.com/AlexxIT/go2rtc/releases/download/$GO2RTC_VERSION/go2rtc_linux_amd64"
          echo "$GO2RTC_SHA256  $RUNNER_TEMP/go2rtc" | sha256sum --check
          chmod +x "$RUNNER_TEMP/go2rtc"
          "$RUNNER_TEMP/go2rtc" -config tests/go2rtc.yaml > "$RUNNER_TEMP/go2rtc.log" 2>&1 &
          for _ in $(seq 1 20); do
            curl -fs http://127.0.0.1:11984/api >/dev/null && exit 0
            sleep 0.5
          done
          exit 1
      - name: Test the bridge
        env:
          GO2RTC_URL: http://127.0.0.1:11984/
        run: pytest tests/test_go2rtc_binary.py
      - name: go2rtc log
        if: failure()
        run: cat "$RUNNER_TEMP/go2rtc.log"

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test and integration requirements
        run: |
          pip install -r requirements_test.txt
          jq -r '.requirements[]' custom_components/aiphone_jo/manifest.json \
            | xargs -r pip install
      - run: pytest

  release-check:
    name: Release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check manifest version, CHANGELOG, tags and vendored library
        run: python scripts/release_tools.py check
